name: Release

on:
  push:
    branches: [main]
  # stages a release tag again, for a release whose staging failed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to stage, such as v3.0.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Stage on npm
    needs: release-please
    if: >-
      !failure() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      # the npm that comes with Node builds native dependencies such as better-sqlite3;
      # the latest npm is needed only for staging
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --global npm@latest
      - run: npm stage publish --access public
