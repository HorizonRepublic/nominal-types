name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Compare with other libraries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run bench:check
      - run: node bench/run.ts --quiet | tee bench-result.md
      - run: node bench/document/run.ts | tee -a bench-result.md
      - run: cat bench-result.md >> "$GITHUB_STEP_SUMMARY"
