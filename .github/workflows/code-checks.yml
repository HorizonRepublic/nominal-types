name: Code checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: code-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:dist

      - name: Coverage report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2.13.0

  # The matrices cover only what `checks` doesn't: it already runs every test on the Node.js
  # release in .node-version and every adapter on the peer releases in devDependencies.
  runtimes:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  nest:
    name: Nest adapter on Nest ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        nest: [11]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: >-
          npm install --no-save --no-audit --no-fund
          @nestjs/common@${{ matrix.nest }}
          @nestjs/core@${{ matrix.nest }}
          @nestjs/testing@${{ matrix.nest }}
          @nestjs/platform-fastify@${{ matrix.nest }}
          @nestjs/platform-express@${{ matrix.nest }}
          @nestjs/microservices@${{ matrix.nest }}
          @nestjs/swagger@${{ matrix.nest }}
      - run: npx vitest run tests/adapters

  oldest-peers:
    name: Adapters on the oldest peer releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The oldest release each range in peerDependencies allows, with the packages that ship in
      # step with it. --legacy-peer-deps: @mikro-orm/sqlite 7.0.0 declares a peer on core ^6.
      - name: Install the oldest peer releases
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";

            const { peerDependencies } = JSON.parse(readFileSync("package.json", "utf8"));
            const companions = {
              "@nestjs/common": ["@nestjs/core", "@nestjs/testing", "@nestjs/platform-express",
                "@nestjs/platform-fastify", "@nestjs/microservices"],
              "@mikro-orm/core": ["@mikro-orm/sqlite"],
            };
            const oldest = (name, range) => [JSON.parse(execFileSync("npm",
              ["view", `${name}@${range}`, "version", "--json"], { encoding: "utf8" }))].flat()[0];

            for (const [name, range] of Object.entries(peerDependencies)) {
              const version = oldest(name, range);

              for (const peer of [name, ...(companions[name] ?? [])]) console.log(`${peer}@${version}`);
            }
          ' > oldest-peers.txt
          # --legacy-peer-deps skips peers, so vite, which vitest takes as a peer, is kept by name
          node -p '"vite@" + require("./node_modules/vite/package.json").version' >> oldest-peers.txt
          cat oldest-peers.txt
          xargs npm install --no-save --no-audit --no-fund --legacy-peer-deps < oldest-peers.txt

      - run: npx vitest run tests/adapters
